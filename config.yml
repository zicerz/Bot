## 配置文件



# 备份配置
backup:
  enable: 0                       # 是否启用备份
  backup_dir: "./backups"         # 备份根目录路径（支持相对路径和绝对路径）

# 重试配置（全局设置）
retry:
  enabled: 1                      # 是否启用任务级重试（1启用，0禁用）
  delay_minutes: 3               # 重试间隔时间（分钟），默认10分钟
  max_attempts: 3                 # 最大重试次数，默认3次
  task_timeout_minutes:  5       # 任务超时时间（分钟），超时后自动终止任务并触发重试

# 机器人配置列表
# webhooks:



test_webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=ee57f939-0e4e-4707-beba-422dae91538e"
error_webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=833b098e-d8b8-43ea-bfdf-cade0d040fb6"
upload_url_template: "https://qyapi.weixin.qq.com/cgi-bin/webhook/upload_media?key={key}&type=file"

tasks:

#-----------------------------------------   task 0 多webhook示例  --------------------------------------     
  - name: "学员明细自动播报"
    excel_path: "C:/Users/EDY/OneDrive - PPLINGO PTE LTD/自动播报文件/学员明细备份.xlsx"
    # 多个webhook配置，每个可独立设置times、capture_configs、send_file_enable
    webhooks:
      - webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=833b098e-d8b8-43ea-bfdf-cade0d040fb6"
        name: "学员明细"
        times: ["07:02", "09:02", "11:02", "13:02", "15:02", "17:02", "19:02", "21:02", "23:52"]
        # --- 独立发送开关 ---
        send_image_enable: 1     # 是否发送截图 (默认1)
        send_text_enable: 1      # 是否发送单元格文字 (默认0)
        send_file_enable: 0      # 是否发送源文件 (默认0)
        capture_configs:
          - sheet_name: "Sheet1"
            range: A1
            name: "test_webhook1"
            cell: "B2"             # 可选, 要读取文字的单元格坐标
            label: "当日新增学员"   # 可选, 文字标签 (cell存在时生效)
            text_position: "up"    # 可选, "up"=文字在截图上/ "down"=下方 (默认down)
            start_day: 1           # 可选，每月开始播报日期（1-31，默认1）
            end_day: 6           # 可选，每月结束播报日期（1-31，默认31）
            # 负数表示从月底倒数：如 start_day: -5 表示倒数第5天，end_day: 0 表示最后一天
            # start_day > end_day 表示跨月范围：如 start_day: 25, end_day: 5 表示每月25日至次月5日

          - sheet_name: "Sheet1"
            range: A12
            name: "test_webhook"
            start_day: 1           # 可选，每月开始播报日期（1-31，默认1）
            end_day: 31           # 可选，每月结束播报日期（1-31，默认31）
            # 负数表示从月底倒数：如 start_day: -5 表示倒数第5天，end_day: 0 表示最后一天
            # start_day > end_day 表示跨月范围：如 start_day: 25, end_day: 5 表示每月25日至次月5日

      - webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=ee57f939-0e4e-4707-beba-422dae91538e"
        name: "学员明细自动播报"
        times: ["07:30", "09:30", "11:30", "13:30", "15:30", "17:02", "19:02", "21:02", "23:52"]
        send_image_enable: 1     # 默认1, 纯截图
        send_text_enable: 0      # 默认0, 与旧行为一致
        send_file_enable: 0
        capture_configs:
          - sheet_name: "昨日课量备份"
            range: E1
            name: "test_webhook2"


